[package]
name = "chuggin"
version = "0.16.0"
edition = "2024"
license = "Apache-2.0"
description = "A terminal harness for persistent projects and continuous local model refinement"
readme = "README.md"
repository = "https://github.com/jmicko/chuggin"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE*"]

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
httpdate = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
shell-words = "1"
dialoguer = "0.12"
ratatui = "0.30"
crossterm = "0.29"
textwrap = "0.16"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = { version = "1", features = ["span-locations"] }
scraper = "0.27.0"
schemars = { version = "1.2.2", features = ["derive"] }
tempfile = "3"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
rmcp = { version = "3.5.0", features = ["server", "transport-io"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
vt100 = "0.16"
