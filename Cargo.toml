[package]
name = "chuggin"
version = "0.5.6"
edition = "2024"
license = "Apache-2.0"
description = "A terminal harness for persistent projects with fresh-context local model stages"
readme = "README.md"
repository = "https://github.com/jmicko/chuggin"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE*"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
shell-words = "1"
dialoguer = "0.12"
sha2 = "0.10"
ratatui = "0.30"
crossterm = "0.29"
textwrap = "0.16"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = { version = "1", features = ["span-locations"] }
scraper = "0.27.0"
schemars = { version = "1.2.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
vt100 = "0.16"
